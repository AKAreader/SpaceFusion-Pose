name: Smoke Check

on:
  push:
    branches:
      - spacefusion-pose
  pull_request:
    branches:
      - spacefusion-pose
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless Pillow matplotlib pandas scipy scikit-image tqdm PyYAML openpyxl tensorboard natsort

      - name: Run public quick-start demo
        run: |
          python examples/quick_start_demo.py \
            --config configs/quick_start_demo.yaml \
            --output-dir outputs/ci_quick_start \
            --size 128 \
            --seed 42

      - name: Run quick-start tests
        run: |
          python -m unittest tests.test_quick_start_demo

      - name: Run smoke check
        run: |
          python examples/quick_smoke_check.py

      - name: Validate example dataset config
        run: |
          python tools/validate_config.py --config configs/example_dataset.yaml
